plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net'
    }
    mavenLocal()
}

// Local network workarounds (unreachable maven.neoforged.net): pins a dynamic
// version and serves a few missing Forge-era artifacts from gradle/local-maven.
// Harmless on machines with full network access.
apply from: 'gradle/offline-pins.gradle'

// The agent subproject has to be evaluated before processResources can reference its
// jar task. Declared after the pins script so that its afterEvaluate hooks are
// registered before :agent is configured.
evaluationDependsOn ':agent'

base {
    archivesName = 'star_sword_mod'
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id

            // POC: -PssQuickPlay=<saveName> 让开发客户端直接进入 run/saves/<saveName>,
            // 用于在没有 GUI 交互的情况下触发实体逻辑(守卫命中验证)。
            if (project.hasProperty('ssQuickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('ssQuickPlay').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // 自附加 agent。发布包默认开启且默认 bridge（真正注入防御）；-PssAgent=0 关闭
            // （对应 -Dstar_sword.poc.agent=0），-PssAgentMode=probe 只做诊断不注入。
            systemProperty 'star_sword.poc.agent', (project.findProperty('ssAgent') ?: '1').toString()
            systemProperty 'star_sword.poc.mode', (project.findProperty('ssAgentMode') ?: 'bridge').toString()
            systemProperty 'star_sword.poc.mapping',
                    file('build/moddev/artifacts/namedToIntermediate.tsrg').absolutePath
            // 让注入的 guard 每次都打印(验收用),默认关闭。
            systemProperty 'starsword.guard.verbose',
                    (project.findProperty('ssAgentVerbose') ?: 'false').toString()
            // 把改写前后的类 dump 到 %TEMP%\ss-agent-dump,便于对比 Javassist 丢掉了什么。
            systemProperty 'starsword.guard.dump',
                    (project.findProperty('ssAgentDump') ?: 'false').toString()
            // 桥接模式验收用:强制把任意玩家当作"受保护",返回一个显式值(默认 7.0)。
            systemProperty 'star_sword.poc.forceProtected',
                    (project.findProperty('ssAgentForce') ?: 'false').toString()
            // 测试钩子:进世界后把玩家推过一遍死亡/移除管线,用来验证 agent 的死亡类闸门。
            systemProperty 'star_sword.poc.forceDie',
                    (project.findProperty('ssAgentForceDie') ?: 'false').toString()
            // 对账开销统计:开发运行默认开,发布包默认关(采样本身约 55-76ns/次)。
            systemProperty 'star_sword.stats',
                    (project.findProperty('ssStats') ?: 'true').toString()
            // 模组日志:开发运行默认开。-PssLog=false 可在开发环境彻底关掉;
            // 发布包不看这个值,由 ModLog 按 FMLEnvironment.production 自动关闭。
            systemProperty 'star_sword.log',
                    (project.findProperty('ssLog') ?: 'true').toString()
            // watchdog 基础间隔(秒);损坏测试时可调小,0 关闭。
            systemProperty 'star_sword.poc.watchdog',
                    (project.findProperty('ssWatchdog') ?: '15').toString()
            // 未知浮点通道:on 真中和 / observe 只记录不改写(灰度观测,可安全开在正式环境) / off 关闭。
            systemProperty 'star_sword.foreignChannelGuard',
                    (project.findProperty('ssForeignGuard') ?: 'on').toString()
            // 自测:玩家登录后执行一条命令(仅开发运行;留空=关闭)。用于手动复现任意状态场景。
            systemProperty 'star_sword.selftest.command',
                    (project.findProperty('ssSelftestCommand') ?: '').toString()
            // 诊断:关闭 BODY(整段替换)注入,用于定位 VerifyError 的来源(仅开发运行)。
            systemProperty 'star_sword.poc.skipBody',
                    (project.findProperty('ssSkipBody') ?: 'false').toString()
            // 权威血量写入语义:false(默认)=只拦减血、允许合法抬高/治疗;true=锁定值压过一切写入。
            systemProperty 'star_sword.health.lockStrict',
                    (project.findProperty('ssLockStrict') ?: 'false').toString()
            // 攻击侧总开关表见 helper/AttackOptions。A2:全部伤害类型轮打,默认关(只保留星辉 MAX 伤害)。
            systemProperty 'star_sword.attack.allDamageTypes',
                    (project.findProperty('ssAllDmg') ?: 'false').toString()
            // A7:死亡锁(120 tick 观察窗 + 50 次强制击杀配额 + 每 tick 驱动),默认开。
            systemProperty 'star_sword.attack.deathLock',
                    (project.findProperty('ssDeathLock') ?: 'true').toString()
            // A11:右键 128 格远距离拾取,默认开。
            systemProperty 'star_sword.attack.itemAttraction',
                    (project.findProperty('ssItemAttract') ?: 'true').toString()
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude(".cache/**")
    exclude("opencode.json")
    exclude("INSTRUCTIONS.md")
    exclude("mc-src/**")
    exclude(".opencode/**")
    exclude("base-mod-api/**")
    exclude("base-mod-src/**")
}

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // If you wish to declare dependencies against mods, make sure to use the 'mod*' configurations so that they're remapped.
	// See https://github.com/neoforged/ModDevGradle/blob/main/LEGACY.md#remapping-mod-dependencies for more information.
	
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // modCompileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // modCompileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // modLocalRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // modImplementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // modImplementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // modImplementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// 最终发布产物是普通 jar（ModDevGradle legacyforge 会对它做 SRG reobf），
// MixinExtension.add 会把编译期生成的 refmap 加进该 jar。移除 ByteBuddy 后不再需要
// shadowJar / 自挂载 agent，普通 jar 即最终产物。
mixin.add(sourceSets.main, "${mod_id}.refmap.json")
mixin {
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
    // 玩家产物里不放开发/测试钩子：ForceDieTest 只在 -Dstar_sword.poc.forceDie=1 时动作，
    // 但它属于测试脚手架，不该出现在发布包里。
    // 注意：排除一个类之后，任何**直接引用**它的代码都会在运行时抛 NoClassDefFoundError。
    // 调用点必须改成反射（见 ModForgeEvents.maybeRunForceDieTest），否则排除 = 线上崩溃。
    exclude '**/ForceDieTest*.class'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// AutoForge: 手写资源与 DataGen 产物可能同名(去重见 pipeline.purge_datagen_duplicates),
// EXCLUDE 保留先到的那份,不让 duplicate entry 炸掉构建。
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 自附加 agent(POC):把 agent 子项目产出的 jar 嵌进 mod jar 的 agent/ 下,
    // 运行时由 PocAgentBootstrap 解压到临时目录再附加。
    from(project(':agent').tasks.named('jar')) {
        into 'agent'
        rename { 'star_sword_agent.jar' }
    }
    dependsOn ':agent:jar'
}
